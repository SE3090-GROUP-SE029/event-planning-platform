name: Feature request
description: Request a new feature or functionality
labels: [feature]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature description
      description: Describe what needs to be implemented.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Define what must be true for this feature to be considered complete.
    validations:
      required: true