# .github/ISSUE_TEMPLATE/bug.yml
name: Bug report
description: Report a defect
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What's broken?
    validations: { required: true }
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations: { required: true }
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual behavior
