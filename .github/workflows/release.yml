name: Release

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/backend.sln
      - name: Build
        run: dotnet build backend/backend.sln --no-restore --configuration Release

  test-backend:
    needs: build-backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Restore
        run: dotnet restore backend/backend.sln
      - name: Unit tests
        run: dotnet test backend/backend.sln --no-restore --configuration Release --logger "trx" --results-directory ./TestResults
        env:
          ConnectionStrings__DefaultConnection: "Host=localhost;Database=app_test;Username=test;Password=test"
      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: ./TestResults

  build-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Upload web build
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: web/dist

  test-web:
    needs: build-web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test

  flutter-analyze:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
      - name: Prepare Flutter environment
        run: |
          if grep -Eiq '(^|_)(secret|token|password|passwd|api[_-]?key|private[_-]?key)(_|=)' .env.example; then
            echo ".env.example contains secret-like settings; refusing to copy it."
            exit 1
          fi
          cp .env.example .env.local
      - run: flutter pub get
      - run: flutter analyze

  flutter-test:
    needs: flutter-analyze
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
      - name: Prepare Flutter environment
        run: |
          if grep -Eiq '(^|_)(secret|token|password|passwd|api[_-]?key|private[_-]?key)(_|=)' .env.example; then
            echo ".env.example contains secret-like settings; refusing to copy it."
            exit 1
          fi
          cp .env.example .env.local
      - run: flutter pub get
      - run: flutter test

  flutter-build:
    needs: flutter-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
      - name: Prepare Flutter environment
        run: |
          if grep -Eiq '(^|_)(secret|token|password|passwd|api[_-]?key|private[_-]?key)(_|=)' .env.example; then
            echo ".env.example contains secret-like settings; refusing to copy it."
            exit 1
          fi
          cp .env.example .env.local
      - run: flutter pub get
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  ai-checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agentic-ai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: pytest

  migration-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: app_migrate_check
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet restore backend/backend.sln
      - name: Build backend
        run: dotnet build backend/backend.sln --configuration Release --no-restore
      - name: Install EF Core CLI
        run: dotnet tool install --global dotnet-ef --version 8.0.11
      - name: Apply all migrations to a scratch DB
        run: >
          dotnet ef database update
          --project backend/src/Infrastructure/Infrastructure.csproj
          --startup-project backend/src/Api/Api.csproj
          --configuration Release
          --no-build
          --connection
          "Host=localhost;Port=5432;Database=app_migrate_check;Username=test;******"

  release-gate:
    if: always()
    needs: [build-backend, test-backend, build-web, test-web, flutter-analyze, flutter-test, ai-checks, migration-check]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        run: |
          if [[ "${{ contains(needs.*.result, 'success') }}" != "true" || "${{ contains(needs.*.result, 'failure') }}" == "true" || "${{ contains(needs.*.result, 'cancelled') }}" == "true" || "${{ contains(needs.*.result, 'skipped') }}" == "true" ]]; then
            echo "Release verification did not pass."
            exit 1
          fi
          echo "All release checks passed."

  create-release:
    needs: [release-gate, flutter-build]
    if: startsWith(github.ref, 'refs/tags/v') && needs.release-gate.result == 'success' && needs.flutter-build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-artifacts/**/*
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Optional: Deploy to staging/production
  # deploy:
  #   needs: [release-gate]
  #   if: startsWith(github.ref, 'refs/tags/v')
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - name: Deploy to production
  #       run: |
  #         # Add your deployment commands here
  #         echo "Deploying version ${{ github.ref_name }}"