[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "event-planning-agentic-ai"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.3",
    "pydantic==2.13.4",
    "pydantic-settings==2.12.0",
    "httpx==0.28.1",
    "python-dotenv==1.2.2",
    "langgraph==1.0.5",
    "langchain==1.2.0",
    "google-generativeai==0.8.5",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "mypy==1.19.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
